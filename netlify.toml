[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------- Seguridad ----------
# La CSP permite scripts y estilos en línea porque Astro y el tema inicial los generan en el HTML.
# Se comprueba en tests/e2e/csp.spec.ts: si agregas un servicio externo (analítica, mapas…), añádelo aquí.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self' https://cloud.umami.is https://api-gateway.umami.dev; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# ---------- Caché ----------
# Archivos con huella en el nombre: se pueden guardar para siempre.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imágenes para redes: cambian poco; un día de caché.
[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/planes/*.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"

# ---------- Redirecciones ----------
# No existe una página /planes/: cada plan vive en /planes/<slug>/.
[[redirects]]
  from = "/planes"
  to = "/"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# Con dominio propio, configura en Netlify (Domain management) que www redirija al dominio principal.
# Ver docs/DESPLIEGUE.md.
