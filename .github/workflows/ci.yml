name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Validar los planes
        run: npm run validate
      - name: Tests
        run: npm test
      - name: Tipos
        run: npx astro check
      - name: Build
        run: npm run build
